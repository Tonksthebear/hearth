alert:
  # Structural layout (color-agnostic)
  inner: "flex"
  icon_wrapper: "shrink-0"
  content: "ml-3"
  content_row: "ml-3 flex-1 md:flex md:justify-between"
  actions_container: "mt-4"
  actions: "-mx-2 -my-1.5 flex"
  dismiss_wrapper: "ml-auto pl-3"
  dismiss_container: "-mx-1.5 -my-1.5"
  list: "list-disc space-y-1 pl-5"
  link_wrapper: "mt-3 text-sm md:mt-0 md:ml-6"
  # Parts with base (structural) + color sub-keys
  # Usage: yass(:alert, :container, :success, :rounded)
  container:
    success:
      base: "p-4 bg-success-50 dark:bg-success-500/10"
      rounded: "rounded-md dark:outline dark:outline-success-500/20"
      accent_border: "border-l-4 border-success-400 dark:border-success-500"
    warning:
      base: "p-4 bg-warning-50 dark:bg-warning-500/10"
      rounded: "rounded-md dark:outline dark:outline-warning-500/15"
      accent_border: "border-l-4 border-warning-400 dark:border-warning-500"
    danger:
      base: "p-4 bg-danger-50 dark:bg-danger-500/15"
      rounded: "rounded-md dark:outline dark:outline-danger-500/25"
      accent_border: "border-l-4 border-danger-400 dark:border-danger-500"
    info:
      base: "p-4 bg-primary-50 dark:bg-primary-500/10"
      rounded: "rounded-md dark:outline dark:outline-primary-500/20"
      accent_border: "border-l-4 border-primary-400 dark:border-primary-500"
  # Usage: yass(:alert, :icon, :success)
  icon:
    base: "size-5"
    success: "text-success-400"
    warning: "text-warning-400 dark:text-warning-300"
    danger: "text-danger-400"
    info: "text-primary-400"
  title:
    base: "text-sm font-medium"
    success: "text-success-800 dark:text-success-200"
    warning: "text-warning-800 dark:text-warning-100"
    danger: "text-danger-800 dark:text-danger-200"
    info: "text-primary-800 dark:text-primary-200"
  text:
    base: "text-sm"
    success: "text-success-700 dark:text-success-300"
    warning: "text-warning-700 dark:text-warning-300"
    danger: "text-danger-700 dark:text-danger-300"
    info: "text-primary-700 dark:text-primary-300"
  description:
    base: "mt-2 text-sm"
    success: "text-success-700 dark:text-success-200/85"
    warning: "text-warning-700 dark:text-warning-100/80"
    danger: "text-danger-700 dark:text-danger-200/80"
    info: "text-primary-700 dark:text-primary-200/85"
  link:
    base: "font-medium"
    success: "text-success-700 hover:text-success-600 dark:text-success-300 dark:hover:text-success-200"
    warning: "text-warning-700 hover:text-warning-600 dark:text-warning-300 dark:hover:text-warning-200"
    danger: "text-danger-700 hover:text-danger-600 dark:text-danger-300 dark:hover:text-danger-200"
    info: "text-primary-700 hover:text-primary-600 dark:text-primary-300 dark:hover:text-primary-200"
  action:
    base: "rounded-md px-2 py-1.5 text-sm font-medium focus-visible:outline-2 focus-visible:outline-offset-2 dark:bg-transparent dark:hover:bg-white/10 dark:focus-visible:outline-offset-1"
    success: "bg-success-50 text-success-800 hover:bg-success-100 focus-visible:outline-success-600 dark:text-success-200 dark:focus-visible:outline-success-500/50"
    warning: "bg-warning-50 text-warning-800 hover:bg-warning-100 focus-visible:outline-warning-600 dark:text-warning-200 dark:focus-visible:outline-warning-500/50"
    danger: "bg-danger-50 text-danger-800 hover:bg-danger-100 focus-visible:outline-danger-600 dark:text-danger-200 dark:focus-visible:outline-danger-500/50"
    info: "bg-primary-50 text-primary-800 hover:bg-primary-100 focus-visible:outline-primary-600 dark:text-primary-200 dark:focus-visible:outline-primary-500/50"
  dismiss:
    base: "inline-flex rounded-md p-1.5 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:outline-hidden dark:bg-transparent dark:focus-visible:ring-offset-1"
    success: "bg-success-50 text-success-500 hover:bg-success-100 focus-visible:ring-success-600 focus-visible:ring-offset-success-50 dark:text-success-400 dark:hover:bg-success-500/10 dark:focus-visible:ring-success-500 dark:focus-visible:ring-offset-success-900"
    warning: "bg-warning-50 text-warning-500 hover:bg-warning-100 focus-visible:ring-warning-600 focus-visible:ring-offset-warning-50 dark:text-warning-400 dark:hover:bg-warning-500/10 dark:focus-visible:ring-warning-500 dark:focus-visible:ring-offset-warning-900"
    danger: "bg-danger-50 text-danger-500 hover:bg-danger-100 focus-visible:ring-danger-600 focus-visible:ring-offset-danger-50 dark:text-danger-400 dark:hover:bg-danger-500/10 dark:focus-visible:ring-danger-500 dark:focus-visible:ring-offset-danger-900"
    info: "bg-primary-50 text-primary-500 hover:bg-primary-100 focus-visible:ring-primary-600 focus-visible:ring-offset-primary-50 dark:text-primary-400 dark:hover:bg-primary-500/10 dark:focus-visible:ring-primary-500 dark:focus-visible:ring-offset-primary-900"

